<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NBA Performance Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="home-page">


    <!-- BACKGROUND -->
    <div class="page-background"></div>

    <div class="background-dark"></div>


    <!-- NAVIGATION -->
    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                🏀
            </div>

            <span>
                NBA Performance Predictor
            </span>

        </div>


        <a href="{{ url_for('home') }}"
           class="nav-home">

            🏠 Home

        </a>

    </header>


    <!-- HERO -->
    <main class="hero-section">


        <div class="hero-content">


            <h1>

                NBA PLAYER

                <span>
                    PERFORMANCE
                </span>

                PREDICTOR

            </h1>


            <p class="hero-description">

                Let data decide if a player is a
                <strong>High Scorer</strong>
                or <strong>Not!</strong>

            </p>


            <a href="{{ url_for('input_page') }}"
               class="main-button sound-button">

                <span class="button-icon">
                    📊
                </span>

                <span>
                    Let's Analyze the Performance
                </span>

                <span>
                    →
                </span>

            </a>


        </div>


    </main>


    <!-- BOTTOM TEXT -->
    <div class="bottom-message">

        <span>Better Data</span>

        <b>→</b>

        <span>Better Predictions</span>

        <b>→</b>

        <span>Better Players</span>

    </div>


    <!-- SOUND -->
    <audio id="basketballSound"
           preload="auto">

        <source
            src="{{ url_for('static', filename='basketball-tap.mp3') }}"
            type="audio/mpeg">

    </audio>


    <script>

        const sound =
            document.getElementById("basketballSound");

        const buttons =
            document.querySelectorAll(".sound-button");


        buttons.forEach(button => {

            button.addEventListener("click", function(event) {

                event.preventDefault();

                const destination = this.href;

                sound.currentTime = 0;

                sound.play().catch(() => {});


                setTimeout(() => {

                    window.location.href = destination;

                }, 280);

            });

        });

    </script>


</body>

</html>
